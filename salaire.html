<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculateur Salaire Net Algérie - Brut en Net (IRG, CNAS)</title>
<meta name="description" content="Calcule ton salaire net à partir du brut en Algérie, avec déduction CNAS et IRG.">
<style>
  body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; color: #222; }
  header { background: #0b5d3b; color: white; padding: 25px 20px; text-align: center; }
  header h1 { margin: 0; font-size: 24px; }
  .container { max-width: 500px; margin: 40px auto; padding: 30px; background: white; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
  label { display: block; margin-top: 15px; font-weight: bold; font-size: 14px; }
  input { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
  button { margin-top: 20px; width: 100%; padding: 12px; background: #0b5d3b; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
  button:hover { background: #094a2f; }
  .result { margin-top: 20px; padding: 15px; background: #eafaf1; border-radius: 8px; display: none; }
  .result p { margin: 6px 0; font-size: 15px; }
  .result strong { color: #0b5d3b; }
  .back { display: block; text-align: center; margin-top: 20px; color: #0b5d3b; text-decoration: none; }
  .disclaimer { margin-top: 20px; font-size: 12px; color: #888; text-align: center; }
</style>
</head>
<body>

<header>
  <h1>Calculateur Salaire Net Algérie</h1>
</header>

<div class="container">
  <label for="brut">Salaire brut mensuel (DZD)</label>
  <input type="number" id="brut" placeholder="Ex: 60000">

  <button onclick="calculer()">Calculer le salaire net</button>

  <div class="result" id="resultat">
    <p>Cotisation CNAS (9%) : <strong id="cnas"></strong> DZD</p>
    <p>Salaire imposable : <strong id="imposable"></strong> DZD</p>
    <p>IRG estimé : <strong id="irg"></strong> DZD</p>
    <p>Salaire net : <strong id="net"></strong> DZD</p>
  </div>

  <p class="disclaimer">Estimation à titre indicatif, basée sur le barème IRG et la CNAS 2026 (sources DGI/CNAS). Ne remplace pas une fiche de paie officielle.</p>

  <a class="back" href="index.html">← Retour aux outils</a>
</div>

<script>
function calculIRG_annuel(imposableAnnuel) {
  let irg = 0;
  if (imposableAnnuel <= 240000) {
    irg = 0;
  } else if (imposableAnnuel <= 480000) {
    irg = (imposableAnnuel - 240000) * 0.23;
  } else if (imposableAnnuel <= 960000) {
    irg = 55200 + (imposableAnnuel - 480000) * 0.27;
  } else if (imposableAnnuel <= 1920000) {
    irg = 185700 + (imposableAnnuel - 960000) * 0.30;
  } else if (imposableAnnuel <= 3840000) {
    irg = 473700 + (imposableAnnuel - 1920000) * 0.33;
  } else {
    irg = 1107300 + (imposableAnnuel - 3840000) * 0.35;
  }
  return irg;
}

function calculer() {
  const brutMensuel = parseFloat(document.getElementById('brut').value);
  if (!brutMensuel || brutMensuel <= 0) {
    alert("Merci d'entrer un salaire brut valide.");
    return;
  }

  const cnas = brutMensuel * 0.09;
  const imposableMensuel = brutMensuel - cnas;
  const imposableAnnuel = imposableMensuel * 12;

  const irgAnnuel = calculIRG_annuel(imposableAnnuel);
  const irgMensuel = irgAnnuel / 12;

  const net = imposableMensuel - irgMensuel;

  document.getElementById('cnas').innerText = cnas.toFixed(2);
  document.getElementById('imposable').innerText = imposableMensuel.toFixed(2);
  document.getElementById('irg').innerText = irgMensuel.toFixed(2);
  document.getElementById('net').innerText = net.toFixed(2);

  document.getElementById('resultat').style.display = 'block';
}
</script>

</body>
</html>
