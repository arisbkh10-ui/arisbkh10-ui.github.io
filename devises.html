 <!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convertisseur Devises DZD EUR USD - Taux Officiel et Marché Parallèle</title>
<meta name="description" content="Convertis facilement entre Dinar Algérien, Euro et Dollar - taux officiel en temps réel et taux du marché parallèle.">
<style>
  body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; color: #222; }
  header { background: #0b5d3b; color: white; padding: 25px 20px; text-align: center; }
  header h1 { margin: 0; font-size: 24px; }
  .container { max-width: 500px; margin: 40px auto; padding: 30px; background: white; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
  label { display: block; margin-top: 15px; font-weight: bold; font-size: 14px; }
  input, select { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
  .row { display: flex; gap: 10px; align-items: end; }
  .row > div { flex: 1; }
  button { margin-top: 20px; width: 100%; padding: 12px; background: #0b5d3b; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
  button:hover { background: #094a2f; }
  .result { margin-top: 20px; padding: 15px; background: #eafaf1; border-radius: 8px; display: none; text-align: center; }
  .result p { margin: 6px 0; font-size: 20px; font-weight: bold; color: #0b5d3b; }
  .rate-info { font-size: 12px; color: #888; text-align: center; margin-top: 10px; }
  .back { display: block; text-align: center; margin-top: 20px; color: #0b5d3b; text-decoration: none; }
  .loading { text-align: center; color: #888; font-size: 14px; margin-top: 15px; }

  .parallel-box { margin-top: 30px; padding: 15px; background: #fff8e6; border-radius: 8px; border: 1px solid #f0d98c; }
  .parallel-box h3 { margin: 0 0 10px; font-size: 15px; color: #7a5b00; }
  .parallel-box table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .parallel-box td { padding: 6px 0; }
  .parallel-box td:last-child { text-align: right; font-weight: bold; }
  .parallel-box .maj { font-size: 11px; color: #999; margin-top: 8px; text-align: right; }
</style>
</head>
<body>

<header>
  <h1>Convertisseur de Devises</h1>
</header>

<div class="container">
  <label for="montant">Montant</label>
  <input type="number" id="montant" placeholder="Ex: 100" value="1">

  <div class="row">
    <div>
      <label for="de">De</label>
      <select id="de">
        <option value="DZD">DZD - Dinar Algérien</option>
        <option value="EUR">EUR - Euro</option>
        <option value="USD">USD - Dollar US</option>
      </select>
    </div>
    <div>
      <label for="vers">Vers</label>
      <select id="vers">
        <option value="EUR">EUR - Euro</option>
        <option value="DZD">DZD - Dinar Algérien</option>
        <option value="USD">USD - Dollar US</option>
      </select>
    </div>
  </div>

  <button onclick="convertir()">Convertir</button>

  <p class="loading" id="loading" style="display:none;">Chargement des taux...</p>

  <div class="result" id="resultat">
    <p id="resultatTexte"></p>
    <p class="rate-info" id="tauxInfo">Taux officiel (Banque d'Algérie)</p>
  </div>

  <div class="parallel-box">
    <h3>💱 Taux marché parallèle (indicatif)</h3>
    <table>
      <tr><td>1 EUR</td><td id="parEUR"></td></tr>
      <tr><td>1 USD</td><td id="parUSD"></td></tr>
    </table>
    <p class="maj" id="parMaj"></p>
  </div>

  <a class="back" href="index.html">← Retour aux outils</a>
</div>

<script>
// 🔧 À METTRE À JOUR MANUELLEMENT (source: tsa-algerie.com ou dzexchange.com)
const tauxParalleleEUR = 242; // 1 EUR en DZD, marché noir
const tauxParalleleUSD = 225; // 1 USD en DZD, marché noir
const dateMiseAJour = "7 septembre 2026";

// Affichage du bloc marché parallèle
document.getElementById('parEUR').innerText = tauxParalleleEUR + ' DZD';
document.getElementById('parUSD').innerText = tauxParalleleUSD + ' DZD';
document.getElementById('parMaj').innerText = 'Mis à jour le ' + dateMiseAJour;

let taux = null;

async function chargerTaux() {
  document.getElementById('loading').style.display = 'block';
  try {
    const response = await fetch('https://open.er-api.com/v6/latest/USD');
    const data = await response.json();
    taux = data.rates;
  } catch (e) {
    alert("Impossible de récupérer les taux de change. Vérifie ta connexion.");
  }
  document.getElementById('loading').style.display = 'none';
}

function convertir() {
  const montant = parseFloat(document.getElementById('montant').value);
  const de = document.getElementById('de').value;
  const vers = document.getElementById('vers').value;

  if (!montant || montant <= 0) {
    alert("Merci d'entrer un montant valide.");
    return;
  }

  if (!taux) {
    alert("Les taux ne sont pas encore chargés, réessaie dans un instant.");
    return;
  }

  const montantEnUSD = montant / taux[de];
  const resultat = montantEnUSD * taux[vers];

  document.getElementById('resultatTexte').innerText =
    montant.toLocaleString() + ' ' + de + ' = ' + resultat.toFixed(2) + ' ' + vers;

  const tauxDirect = taux[vers] / taux[de];
  document.getElementById('tauxInfo').innerText =
    '1 ' + de + ' = ' + tauxDirect.toFixed(4) + ' ' + vers + ' (taux officiel)';

  document.getElementById('resultat').style.display = 'block';
}

chargerTaux();
</script>

</body>
</html>
